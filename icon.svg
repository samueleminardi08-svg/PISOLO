<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF80AB" />
      <stop offset="50%" stop-color="#F06292" />
      <stop offset="100%" stop-color="#D81B60" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFE4E9" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#880E4F" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Soft Inner Glow Circle -->
  <circle cx="256" cy="256" r="190" fill="url(#cloudGrad)" />
  
  <!-- Decorative Floating Hearts -->
  <path d="M256 120 C240 90, 200 90, 190 120 C180 150, 220 180, 256 210 C292 180, 332 150, 322 120 C312 90, 272 90, 256 120 Z" fill="#E91E63" />
  <circle cx="120" cy="160" r="14" fill="#FF4081" opacity="0.8" />
  <circle cx="392" cy="160" r="14" fill="#0288D1" opacity="0.8" />
  
  <!-- Pisolo Shark Emoji & Micio Kitty Emoji Representation -->
  <g transform="translate(130, 210) scale(1.1)">
    <!-- Pisolo 🦈 -->
    <text x="20" y="100" font-size="110" text-anchor="middle" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🦈</text>
    <!-- Micio 🐱 -->
    <text x="180" y="100" font-size="110" text-anchor="middle" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🐱</text>
  </g>
  
  <!-- Badge Label Pill -->
  <g transform="translate(256, 410)">
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="#FFFFFF" filter="url(#shadow)" />
    <text x="0" y="8" font-size="20" font-weight="800" fill="#D81B60" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">PISOLO &amp; MICIO</text>
  </g>
</svg>
